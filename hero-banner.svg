<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#280820" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#110412" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#050106" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="heartAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="neonHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#fed7aa;#ffffff" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff758c">
        <animate attributeName="stop-color" values="#ff758c;#fda4af;#ff758c" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f43f5e">
        <animate attributeName="stop-color" values="#f43f5e;#ff758c;#f43f5e" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes cardiacCycle {
        0% { transform: scale(1); }
        12% { transform: scale(1.15); }
        18% { transform: scale(1.02); }
        28% { transform: scale(1.22); }
        45% { transform: scale(0.97); }
        60% { transform: scale(1.03); }
        75% { transform: scale(1); }
        100% { transform: scale(1); }
      }

      @keyframes auraBreath {
        0% { transform: scale(0.85); opacity: 0.35; }
        12% { transform: scale(1.2); opacity: 0.75; }
        28% { transform: scale(1.4); opacity: 0.85; }
        60% { transform: scale(1.05); opacity: 0.4; }
        100% { transform: scale(0.85); opacity: 0.35; }
      }

      @keyframes ripple1 {
        0% { r: 40px; opacity: 0.9; }
        100% { r: 230px; opacity: 0; }
      }

      @keyframes ripple2 {
        0% { r: 40px; opacity: 0.9; }
        100% { r: 230px; opacity: 0; }
      }

      @keyframes starFloat {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(12px); opacity: 0.9; }
        100% { transform: translateY(-50px) translateX(-8px); opacity: 0; }
      }

      @keyframes liveBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.75); }
      }

      @keyframes ecgDash {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-heart-shape {
        transform-origin: 480px 170px;
        animation: cardiacCycle 1.1s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      .pulse-aura-shape {
        transform-origin: 480px 170px;
        animation: auraBreath 1.1s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
      }

      .wave-ring-1 {
        animation: ripple1 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: 480px 170px;
      }

      .wave-ring-2 {
        animation: ripple2 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        animation-delay: 1.1s;
        transform-origin: 480px 170px;
      }

      .live-status-dot {
        animation: liveBlink 1.3s ease-in-out infinite;
        transform-origin: 52px 42px;
      }

      .star-a { animation: starFloat 3.2s ease-in-out infinite; }
      .star-b { animation: starFloat 4.1s ease-in-out infinite 0.8s; }
      .star-c { animation: starFloat 3.7s ease-in-out infinite 1.5s; }
      .star-d { animation: starFloat 4.6s ease-in-out infinite 2.2s; }
      .star-e { animation: starFloat 3.5s ease-in-out infinite 1.1s; }

      .ecg-path {
        stroke-dasharray: 1200;
        stroke-dashoffset: 0;
        animation: ecgDash 3.2s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Shell -->
  <rect width="960" height="380" rx="16" fill="url(#heroBg)" />
  <rect width="960" height="380" rx="16" fill="none" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Subtle Perspective Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="50" x2="960" y2="50" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="150" x2="960" y2="150" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="250" x2="960" y2="250" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="0" y1="350" x2="960" y2="350" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="240" y1="0" x2="240" y2="380" />
    <line x1="360" y1="0" x2="360" y2="380" />
    <line x1="480" y1="0" x2="480" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="720" y1="0" x2="720" y2="380" />
    <line x1="840" y1="0" x2="840" y2="380" />
  </g>

  <!-- Floating Biomorphic Embers -->
  <circle cx="140" cy="120" r="1.8" fill="#fda4af" class="star-a" />
  <circle cx="260" cy="240" r="2.4" fill="#f43f5e" class="star-b" />
  <circle cx="380" cy="80" r="1.5" fill="#ffffff" class="star-c" />
  <circle cx="590" cy="70" r="2.0" fill="#fbcfe8" class="star-d" />
  <circle cx="710" cy="220" r="2.2" fill="#fda4af" class="star-e" />
  <circle cx="830" cy="110" r="1.8" fill="#ff758c" class="star-b" />
  <circle cx="200" cy="310" r="1.4" fill="#ffffff" class="star-d" />
  <circle cx="780" cy="320" r="2.2" fill="#f43f5e" class="star-c" />

  <!-- Top Telemetry Status Bar -->
  <g transform="translate(35, 26)">
    <rect x="0" y="0" width="215" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <circle cx="17" cy="16" r="4.5" fill="#10b981" class="live-status-dot" />
    <circle cx="17" cy="16" r="8" fill="none" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <text x="32" y="20" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">BIOLOGICAL ENGINE: ALIVE</text>

    <!-- Telemetry Badges Right -->
    <g transform="translate(605, 0)">
      <rect x="0" y="0" width="110" height="32" rx="16" fill="rgba(244, 63, 94, 0.15)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1" />
      <text x="55" y="20" fill="#fda4af" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">&#x2764;&#xfe0f; 70 BPM PULSE</text>

      <rect x="118" y="0" width="165" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="200" y="20" fill="#e2e8f0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">900 PARTICLES &#x2022; 60 FPS</text>
    </g>
  </g>

  <!-- Concentric Rippling Kinetic Waves -->
  <circle cx="480" cy="170" fill="none" stroke="#f43f5e" stroke-width="1.5" class="wave-ring-1" />
  <circle cx="480" cy="170" fill="none" stroke="#ff758c" stroke-width="1.2" class="wave-ring-2" />

  <!-- Radial Aura Glow behind Heart -->
  <ellipse cx="480" cy="170" rx="170" ry="130" fill="url(#heartAura)" class="pulse-aura-shape" />

  <!-- Animated Celestial Dust Ring -->
  <g transform="translate(480, 170)">
    <ellipse rx="155" ry="62" fill="none" stroke="#fda4af" stroke-width="1" stroke-dasharray="6, 16" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </ellipse>
    <ellipse rx="125" ry="52" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="8, 22" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Central Pulsating Heart -->
  <g class="pulse-heart-shape" filter="url(#deepGlow)">
    <path d="M 480, 138 
             C 475, 106  435, 90  405, 110 
             C 365, 138  375, 190  415, 225 
             L 480, 270 
             L 545, 225 
             C 585, 190  595, 138  555, 110 
             C 525, 90   485, 106  480, 138 Z"
          fill="url(#neonHeart)" opacity="0.96" />

    <path d="M 480, 144 
             C 476, 116  440, 103  412, 120 
             C 378, 144  386, 188  424, 219 
             L 480, 260 
             L 536, 219 
             C 574, 188  582, 144  548, 120 
             C 520, 103  484, 116  480, 144 Z"
          fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.8" />

    <ellipse cx="435" cy="136" rx="13" ry="6.5" transform="rotate(-30 435 136)" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Title & Typography -->
  <text x="480" y="318" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#titleGrad)" letter-spacing="3" filter="url(#glow)">
    A HEART FOR YOU
  </text>

  <text x="480" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="rgba(255, 255, 255, 0.7)" letter-spacing="4.5">
    LIVING PARTICLES &#x2022; WEB AUDIO SYNTHESIZER &#x2022; BIOMORPHIC CANVAS
  </text>

  <!-- Integrated ECG Base Scan -->
  <path class="ecg-path" d="M 0,378 L 280,378 L 305,378 L 315,368 L 325,388 L 335,350 L 348,392 L 358,374 L 368,378 L 520,378 L 545,378 L 555,368 L 565,388 L 575,350 L 588,392 L 598,374 L 608,378 L 960,378" 
        fill="none" stroke="#f43f5e" stroke-width="2.2" opacity="0.85" filter="url(#glow)" />
</svg>

